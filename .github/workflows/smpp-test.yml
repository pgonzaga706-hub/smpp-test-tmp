name: EMAG Phase 9
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase9:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: EMAG Phase 9
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, ssl, re
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          BASE = "https://ess.emag.verizonwireless.com"
          
          def get(url, maxbytes=65536):
              rq = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=15) as r:
                      return r.status, r.read(maxbytes).decode("utf-8", errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read(512).decode("utf-8", errors="replace")
              except Exception as e:
                  return 0, str(e)
          
          print("=== emag-modern.css - extract all URLs ===")
          s, b = get(BASE + "/emag/assets/css/emag-modern.css")
          print(f"Size: {len(b)} chars")
          # Find all asset URLs
          url_pat = r"/emag/assets/[a-zA-Z0-9/._-]+"
          found_urls = list(set(re.findall(url_pat, b)))
          found_urls.sort()
          print(f"Asset URLs in CSS ({len(found_urls)}):")
          for u in found_urls:
              print(f"  {u}")
          
          print()
          print("=== Try JS paths with version hash ===")
          # Version from emag-modern.css?v=107b752
          version = "107b752"
          for path in [
              f"/emag/assets/js/backbone-concat.js?v={version}",
              f"/emag/assets/js/backbone-concat-{version}.js",
              "/emag/assets/js/backbone/backbone-concat.js",
              "/emag/assets/js/app/backbone-concat.js",
              "/emag/assets/js/secure/backbone-concat.js",
              "/emag/assets/js/vmg/backbone-concat.js",
              "/emag/assets/js/emag/vmg-app.js",
              "/emag/assets/js/vmg-concat.js",
              "/emag/assets/js/scripts.js",
              "/emag/assets/js/application.js",
          ]:
              s, b = get(BASE + path, maxbytes=200)
              if s == 200:
                  print(f"[FOUND] {path}: {b[:200]}")
              else:
                  print(f"[{s}] {path}")
          
          print()
          print("=== Static asset directory listing ===")
          for path in [
              "/emag/assets/js/",
              "/emag/assets/",
              "/emag/assets/js/emag/",
              "/emag/assets/js/vmg/",
              "/emag/assets/js/app/",
          ]:
              s, b = get(BASE + path, maxbytes=2000)
              is_listing = "Index of" in b or "<a href" in b[:500]
              if s == 200 and is_listing:
                  print(f"[LISTING!] {path}: {b[:500]}")
              elif s != 404:
                  print(f"[{s}] {path}: {b[:100]}")
              else:
                  print(f"[{s}] {path}")
          
          print("DONE")
          PYEOF
