name: EMAG Phase 10b
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase10b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: EMAG Phase 10b
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, ssl, re
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          BASE = "https://ess.emag.verizonwireless.com"
          
          def fetch(url, maxbytes=65536):
              rq = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=15) as r:
                      hdrs = dict(r.headers)
                      body = r.read(maxbytes).decode("utf-8", errors="replace")
                      return r.status, hdrs, body
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read(512).decode("utf-8", errors="replace")
              except Exception as e:
                  return 0, {}, str(e)
          
          print("=== EMAG headers ===")
          s, hdrs, b = fetch(BASE + "/emag/")
          for k, v in sorted(hdrs.items()):
              kl = k.lower()
              if kl in ["content-security-policy", "server", "x-powered-by", "set-cookie",
                        "x-frame-options", "strict-transport-security", "content-type"][:]:
                  print(f"  {k}: {v[:200]}")
          
          print()
          print("=== landing.js ===")
          s, hdrs, b = fetch(BASE + "/emag/assets/js/open/landing.js")
          print(f"[{s}] {len(b)} chars")
          print(b)
          
          print()
          print("=== landing_services.js ===")
          s, hdrs, b = fetch(BASE + "/emag/assets/js/open/landing_services.js")
          print(f"[{s}] {len(b)} chars")
          print(b)
          
          print()
          print("=== CSS url() patterns ===")
          s, hdrs, b = fetch(BASE + "/emag/assets/css/emag-modern.css")
          # Find url() content - avoid quotes in pattern
          urls_in_css = re.findall(r"url[(]([^)]{1,100})[)]", b)
          print(f"url() count: {len(urls_in_css)}")
          for u in urls_in_css[:30]:
              print(f"  {u}")
          font_refs = re.findall(r"[a-zA-Z0-9/_.-]+[.](woff2|woff|ttf|eot|svg)", b)
          print(f"Font refs: {font_refs[:20]}")
          slash_paths = re.findall(r"(/[a-zA-Z0-9/_.-]{3,60})", b)
          print(f"Slash paths in CSS: {list(set(slash_paths))[:30]}")
          
          print()
          print("=== Git exposure ===")
          for path in [
              "/.git/config",
              "/.git/HEAD",
              "/emag/.git/config",
              "/emag/.git/HEAD",
          ]:
              s, hdrs, b = fetch(BASE + path, maxbytes=500)
              if s == 200:
                  print(f"[GIT EXPOSED] {path}: {b[:300]}")
              else:
                  print(f"[{s}] {path}")
          
          print("DONE")
          PYEOF
