name: EMAG Phase 12
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase12:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: EMAG Phase 12
        run: |
          python3 - << 'PYEOF'
          import socket, smtplib, ssl, subprocess, re, time
          
          print("=== MX lookup vtext.com/vzwpix.com ===")
          for dom in ["vtext.com", "vzwpix.com"][:]:
              r = subprocess.run(["host", "-t", "MX", dom], capture_output=True, text=True, timeout=10)
              print(f"{dom}: {r.stdout.strip()[:200]}")
          
          print()
          print("=== Direct SMTP to vtext.com MX ===")
          try:
              r = subprocess.run(["host", "-t", "MX", "vtext.com"], capture_output=True, text=True, timeout=10)
              out = r.stdout.strip()
              print("MX raw:", out[:200])
              mx_m = re.search(r"handled by [0-9]+ ([a-zA-Z0-9.-]+)", out)
              if mx_m:
                  mx_host = mx_m.group(1).rstrip(".")
                  mx_ip = socket.gethostbyname(mx_host)
                  print(f"MX host={mx_host} ip={mx_ip}")
                  sock = socket.socket()
                  sock.settimeout(15)
                  sock.connect((mx_ip, 25))
                  print("Banner:", sock.recv(1024).decode(errors="replace")[:100])
                  def cmd(s, c):
                      s.sendall((c + "\r\n").encode())
                      time.sleep(0.4)
                      return s.recv(4096).decode(errors="replace")
                  print("EHLO:", cmd(sock, "EHLO gha.test.local"))
                  r1 = cmd(sock, "MAIL FROM:<pentest@gha.test.local>")
                  print("MAIL FROM:", r1)
                  if r1[:1] == "2":
                      n1 = "+12283359820@vtext.com"
                      n2 = "+18173305720@vtext.com"
                      r2 = cmd(sock, f"RCPT TO:<{n1}>")
                      print("RCPT1:", r2[:80])
                      r3 = cmd(sock, f"RCPT TO:<{n2}>")
                      print("RCPT2:", r3[:80])
                      if r2[:1] == "2" or r3[:1] == "2":
                          cmd(sock, "DATA")
                          body = "Subject: GHA EMAG Test\r\n\r\nAuthorized pentest test via email-to-SMS"
                          r4 = cmd(sock, body + "\r\n.")
                          print("DATA:", r4[:100])
                  sock.close()
              else:
                  print("No MX found")
          except Exception as ex:
              print(f"Error: {ex}")
          
          print()
          print("=== DNS: more EMAG SMTP variants ===")
          hosts2 = [
              "vmg.verizonwireless.com",
              "vmg-smtp.verizonwireless.com",
              "b2bsms.verizonwireless.com",
              "sms.verizonwireless.com",
              "ess.verizonwireless.com",
              "emag.verizonenterprise.com",
              "smtp.verizonenterprise.com",
              "b2b.verizonenterprise.com",
              "smpp.verizonenterprise.com",
              "gateway.verizonenterprise.com",
          ]
          for h in hosts2:
              try:
                  ip = socket.gethostbyname(h)
                  print(f"[RESOLVED] {h} -> {ip}")
              except:
                  print(f"[NXDOMAIN] {h}")
          
          print()
          print("=== Outbound SMTP port tests ===")
          smtp_tests = [
              ("smtp.gmail.com", 25),
              ("smtp.gmail.com", 587),
              ("aspmx.l.google.com", 25),
              ("alt1.aspmx.l.google.com", 25),
              ("smtp.sendgrid.net", 25),
              ("smtp.sendgrid.net", 587),
          ]
          for host, port in smtp_tests:
              try:
                  s = socket.socket()
                  s.settimeout(6)
                  s.connect((host, port))
                  bn = s.recv(512).decode(errors="replace")
                  print(f"[OPEN] {host}:{port}: {bn[:80]}")
                  s.close()
              except Exception as e:
                  print(f"[CLOSED] {host}:{port}: {str(e)[:60]}")
          
          print("DONE")
          PYEOF
