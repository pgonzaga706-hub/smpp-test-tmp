name: EMAG Phase 11
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase11:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: EMAG Phase 11
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, ssl, socket, subprocess, re
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          BASE = "https://ess.emag.verizonwireless.com"
          
          def post_xml(url, xml_body, content_type="text/xml"):
              data = xml_body.encode("utf-8")
              rq = urllib.request.Request(url, data=data, method="POST",
                  headers={"User-Agent": "Mozilla/5.0", "Content-Type": content_type,
                           "Accept": "text/xml,application/xml,*/*"})
              try:
                  op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=15) as r:
                      return r.status, r.read(2048).decode("utf-8", errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read(1024).decode("utf-8", errors="replace")
              except Exception as e:
                  return 0, str(e)
          
          def get(url, maxbytes=4096, extra_hdrs=None):
              hdrs = {"User-Agent": "Mozilla/5.0"}
              if extra_hdrs:
                  hdrs.update(extra_hdrs)
              rq = urllib.request.Request(url, headers=hdrs)
              try:
                  op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=10) as r:
                      return r.status, r.read(maxbytes).decode("utf-8", errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read(512).decode("utf-8", errors="replace")
              except Exception as e:
                  return 0, str(e)
          
          print("=== WCTP proper XML test ===")
          wctp_xml = """<?xml version="1.0" encoding="utf-8"?>
          <!DOCTYPE wctp-Operation SYSTEM "http://dtd.wctp.org/wctp-dtd-v1r1.dtd">
          <wctp-Operation wctpVersion="WCTP-DTD-V1r1">
          <wctp-SubmitRequest>
          <wctp-SubmitHeader submitID="test001" sendResponsesToID="test001">
          <wctp-Originator senderID="test" securityCode="test"/>
          <wctp-Recipient recipientID="+12283359820"/>
          </wctp-SubmitHeader>
          <wctp-Payload>
          <wctp-AlphanumericMessage>Test</wctp-AlphanumericMessage>
          </wctp-Payload>
          </wctp-SubmitRequest>
          </wctp-Operation>"""
          for ct in ["text/xml", "application/xml", "text/xml; charset=utf-8"][:]:
              s, b = post_xml(BASE + "/emag/wctp", wctp_xml, ct)
              print(f"[WCTP {ct}] {s}: {b[:300]}")
          
          print()
          print("=== API endpoint discovery ===")
          for path in [
              "/emag/api/xml",
              "/emag/api/v1/messages",
              "/emag/api/v2/messages",
              "/emag/api/messages/send",
              "/emag/api/send",
              "/emag/api/sms",
              "/emag/api/submit",
              "/emag/api/wctp",
              "/emag/wctp/submit",
              "/emag/servlet/",
              "/emag/service/",
              "/emag/services/",
              "/emag/ws/",
              "/emag/rest/",
          ]:
              s, b = get(BASE + path)
              if s not in (404,):
                  print(f"[{s}] {path}: {b[:200]}")
              else:
                  print(f"[{s}] {path}")
          
          print()
          print("=== DNS discovery for EMAG sub-services ===")
          hostnames = [
              "smtp.emag.verizonwireless.com",
              "smpp.emag.verizonwireless.com",
              "snpp.emag.verizonwireless.com",
              "mail.emag.verizonwireless.com",
              "api.emag.verizonwireless.com",
              "emag-smtp.verizonwireless.com",
              "emag-api.verizonwireless.com",
              "emag.vzwcorp.com",
              "smtp.vzwcorp.com",
          ]
          for h in hostnames:
              try:
                  ip = socket.gethostbyname(h)
                  print(f"[RESOLVED] {h} -> {ip}")
              except Exception as e:
                  print(f"[NXDOMAIN] {h}")
          
          print()
          print("=== SMTP to vtext.com (email-to-SMS) ===")
          import smtplib
          # Try Gmail SMTP to send to vtext.com
          try:
              smtp = smtplib.SMTP("smtp.gmail.com", 587, timeout=10)
              smtp.ehlo()
              banner = "connected"
              smtp.quit()
              print(f"Gmail SMTP 587: {banner}")
          except Exception as e:
              print(f"Gmail SMTP 587: {e}")
          
          print()
          print("=== OPTIONS on API endpoints ===")
          for path in ["/emag/api/messages", "/emag/api/reports", "/emag/wctp"][:]:
              rq = urllib.request.Request(BASE + path, method="OPTIONS",
                  headers={"User-Agent": "Mozilla/5.0", "Origin": "https://ess.emag.verizonwireless.com",
                           "Access-Control-Request-Method": "POST"})
              try:
                  op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=10) as r:
                      ah = r.headers.get("Allow", "")
                      cors = r.headers.get("Access-Control-Allow-Methods", "")
                      print(f"[{r.status}] {path} Allow={ah} CORS={cors}")
              except urllib.error.HTTPError as e:
                  ah = e.headers.get("Allow", "")
                  print(f"[{e.code}] {path} Allow={ah}")
              except Exception as e:
                  print(f"[ERR] {path}: {e}")
          
          print("DONE")
          PYEOF
