name: EMAG Phase 8
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase8:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: EMAG Phase 8
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, ssl, time, socket, smtplib
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          BASE = "https://ess.emag.verizonwireless.com"
          
          def get(url, headers=None, maxbytes=65536):
              h = {"User-Agent": "Mozilla/5.0"}
              if headers: h.update(headers)
              rq = urllib.request.Request(url, headers=h)
              try:
                  op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=15) as r:
                      ct = r.headers.get("Content-Type","")
                      rb = r.read(maxbytes).decode("utf-8", errors="replace")
                      return r.status, ct, rb
              except urllib.error.HTTPError as e:
                  return e.code, "", e.read(512).decode("utf-8", errors="replace")
              except Exception as e:
                  return 0, "", str(e)
          
          print("=== backbone-concat.js (main SPA) ===")
          for path in [
              "/emag/assets/js/backbone-concat.js",
              "/emag/assets/js/emag/backbone-concat.js",
              "/emag/assets/js/concat.js",
              "/emag/assets/js/all.js",
              "/emag/assets/js/emag-all.js",
              "/emag/assets/js/app-concat.js",
          ]:
              s, ct, b = get(BASE + path, maxbytes=500)
              if s == 200:
                  print(f"[{s}] FOUND! {path} ({len(b)} chars): {b[:300]}")
              else:
                  print(f"[{s}] {path}")
          
          print()
          print("=== CSS analysis for JS paths ===")
          s, ct, b = get(BASE + "/emag/assets/css/backbone-concat.css", maxbytes=65536)
          print(f"[{s}] backbone-concat.css {len(b)} chars")
          import re
          urls = re.findall(r"url\(["\x27]?([^\)"\x27]+)["\x27]?\)", b)
          js_refs = re.findall(r"[\w-]+\.js", b)
          print(f"CSS URLs: {urls[:10]}")
          print(f"JS refs in CSS: {js_refs[:10]}")
          
          print()
          print("=== SMTP probe (email-to-SMS) ===")
          smtp_targets = [
              ("69.78.159.216", 25),
              ("69.78.159.216", 465),
              ("69.78.159.216", 587),
              ("ess.emag.verizonwireless.com", 25),
          ]
          for host, port in smtp_targets:
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(8)
                  sock.connect((host, port))
                  banner = sock.recv(1024).decode("utf-8", errors="replace")
                  print(f"[OPEN] {host}:{port} banner: {banner[:100]}")
                  sock.close()
              except Exception as e:
                  print(f"[{port}] {host}:{port}: {str(e)[:60]}")
          
          print()
          print("=== SNPP probe (port 444) ===")
          for host, port in [("69.78.159.216", 444), ("69.78.159.216", 7777), ("69.78.159.216", 9000)]:
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(5)
                  sock.connect((host, port))
                  banner = sock.recv(512).decode("utf-8", errors="replace")
                  print(f"[OPEN] {host}:{port}: {banner[:80]}")
                  sock.close()
              except Exception as e:
                  print(f"[CLOSED] {host}:{port}: {str(e)[:50]}")
          
          print()
          print("=== EMAG API path discovery via CSS ===")
          s, ct, b = get(BASE + "/emag/assets/css/emag-modern.css", maxbytes=65536)
          print(f"[{s}] emag-modern.css {len(b)} chars")
          api_candidates = re.findall(r"/emag/[\w/.-]+", b)
          print(f"Paths in CSS: {list(set(api_candidates))[:20]}")
          
          print("DONE")
          PYEOF
