name: EMAG Phase 6
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: EMAG Phase 6
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, ssl, time
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          BASE = "https://ess.emag.verizonwireless.com"
          
          def get(url, headers=None, maxbytes=16384):
              h = {"User-Agent": "Mozilla/5.0"}
              if headers: h.update(headers)
              rq = urllib.request.Request(url, headers=h)
              try:
                  op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=15) as r:
                      ct = r.headers.get("Content-Type","")
                      rb = r.read(maxbytes).decode("utf-8", errors="replace")
                      return r.status, ct, rb
              except urllib.error.HTTPError as e:
                  return e.code, "", e.read(512).decode("utf-8", errors="replace")
              except Exception as e:
                  return 0, "", str(e)
          
          print("=== Full login HTML (32KB) ===")
          s, ct, b = get(BASE + "/emag/", maxbytes=32768)
          print(f"[{s}] {len(b)} chars")
          print(b)
          
          print()
          print("=== EMAG JavaScript files ===")
          js_paths = [
              "/emag/assets/js/backbone-concat.js",
              "/emag/assets/js/app.js",
              "/emag/assets/js/main.js",
              "/emag/assets/js/emag.js",
              "/emag/assets/js/emag-app.js",
              "/emag/assets/js/bundle.js",
              "/emag/assets/js/vendor.js",
              "/emag/assets/js/router.js",
              "/emag/assets/js/routes.js",
          ]
          for path in js_paths:
              s, ct, b = get(BASE + path, maxbytes=2048)
              if s == 200:
                  print(f"[{s}] FOUND {path} ({len(b)} chars): {b[:500]}")
              else:
                  print(f"[{s}] {path}")
          
          print("DONE")
          PYEOF
