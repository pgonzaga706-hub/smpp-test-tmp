name: EMAG Phase 8b
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase8b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: EMAG Phase 8b
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, ssl, time, socket, re
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          BASE = "https://ess.emag.verizonwireless.com"
          
          def get(url, maxbytes=65536):
              rq = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=15) as r:
                      return r.status, r.read(maxbytes).decode("utf-8", errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read(512).decode("utf-8", errors="replace")
              except Exception as e:
                  return 0, str(e)
          
          print("=== backbone-concat.js candidates ===")
          for path in [
              "/emag/assets/js/backbone-concat.js",
              "/emag/assets/js/emag/backbone-concat.js",
              "/emag/assets/js/concat.js",
              "/emag/assets/js/all.js",
              "/emag/assets/js/emag-all.js",
              "/emag/assets/js/app-concat.js",
              "/emag/assets/js/vmg-app.js",
              "/emag/assets/js/emag-app.js",
          ]:
              s, b = get(BASE + path, maxbytes=200)
              if s == 200:
                  print(f"[FOUND] {path}: {b[:200]}")
              else:
                  print(f"[{s}] {path}")
          
          print()
          print("=== CSS analysis ===")
          s, b = get(BASE + "/emag/assets/css/backbone-concat.css")
          print(f"backbone-concat.css: {s} {len(b)} chars")
          js_refs = re.findall(r"[\w-]+\.js", b)
          print(f"JS refs: {js_refs[:15]}")
          emag_paths = re.findall(r"/emag/[\w/.-]+", b)
          print(f"EMAG paths: {list(set(emag_paths))[:20]}")
          
          print()
          s, b = get(BASE + "/emag/assets/css/emag-modern.css")
          print(f"emag-modern.css: {s} {len(b)} chars")
          js_refs2 = re.findall(r"[\w-]+\.js", b)
          print(f"JS refs: {js_refs2[:15]}")
          emag_paths2 = re.findall(r"/emag/[\w/.-]+", b)
          print(f"EMAG paths: {list(set(emag_paths2))[:20]}")
          
          print()
          print("=== SMTP probe ===")
          for host, port in [("69.78.159.216", 25), ("69.78.159.216", 587), ("ess.emag.verizonwireless.com", 25)]:
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(8)
                  sock.connect((host, port))
                  banner = sock.recv(1024).decode("utf-8", errors="replace")
                  print(f"[OPEN] {host}:{port} {banner[:100]}")
                  sock.close()
              except Exception as e:
                  print(f"[{port}] {host}:{port}: {str(e)[:60]}")
          
          print()
          print("=== SNPP probe ===")
          for host, port in [("69.78.159.216", 444), ("ess.emag.verizonwireless.com", 444)]:
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(5)
                  sock.connect((host, port))
                  banner = sock.recv(512).decode("utf-8", errors="replace")
                  print(f"[OPEN] {host}:{port}: {banner[:80]}")
                  sock.close()
              except Exception as e:
                  print(f"[CLOSED] {host}:{port}: {str(e)[:50]}")
          
          print("DONE")
          PYEOF
