name: EMAG Phase 13
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  phase13:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: EMAG Phase 13
        run: |
          python3 - << 'PYEOF'
          import socket, ssl, urllib.request, urllib.error, json, subprocess, re, time
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          
          print("=== gateway.verizonenterprise.com probe ===")
          gw_ip = "23.209.84.155"
          print(f"IP: {gw_ip}")
          for port in [80, 443, 8080, 8443, 25, 587, 2775, 9080, 9443]:
              try:
                  s = socket.socket()
                  s.settimeout(5)
                  s.connect((gw_ip, port))
                  if port in [443, 8443]:
                      sc = ctx.wrap_socket(s, server_hostname="gateway.verizonenterprise.com")
                      sc.sendall(b"GET / HTTP/1.0\r\nHost: gateway.verizonenterprise.com\r\n\r\n")
                      d = sc.recv(512).decode(errors="replace")
                      sc.close()
                  elif port in [80, 8080]:
                      s.sendall(b"GET / HTTP/1.0\r\nHost: gateway.verizonenterprise.com\r\n\r\n")
                      d = s.recv(512).decode(errors="replace")
                      s.close()
                  else:
                      d = s.recv(512).decode(errors="replace")
                      s.close()
                  print(f"[OPEN:{port}]: {d[:100]}")
              except Exception as e:
                  print(f"[{port}]: {str(e)[:60]}")
          
          print()
          print("=== gateway.verizonenterprise.com HTTPS ===")
          for path in ["/", "/emag", "/api", "/sms", "/gateway"][:]:
              rq = urllib.request.Request("https://gateway.verizonenterprise.com" + path,
                  headers={"User-Agent": "Mozilla/5.0", "Host": "gateway.verizonenterprise.com"})
              try:
                  op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  with op.open(rq, timeout=10) as r:
                      ct = r.headers.get("Content-Type", "")
                      print(f"[{r.status}] {path} ct={ct[:40]}: {r.read(200).decode(errors=chr(114)+chr(101)+chr(112)+chr(108)+chr(97)+chr(99)+chr(101))[:150]}")
              except urllib.error.HTTPError as e:
                  loc = e.headers.get("Location", "")
                  print(f"[{e.code}] {path} loc={loc[:100]}")
              except Exception as e:
                  print(f"[ERR] {path}: {e}")
          
          print()
          print("=== SendGrid open relay test (no auth) ===")
          try:
              s = socket.socket()
              s.settimeout(10)
              s.connect(("smtp.sendgrid.net", 25))
              print("Banner:", s.recv(512).decode(errors="replace")[:100])
              def cmd(sock, c):
                  sock.sendall((c + "\r\n").encode())
                  time.sleep(0.5)
                  return sock.recv(4096).decode(errors="replace")
              print("EHLO:", cmd(s, "EHLO gha.local"))
              r1 = cmd(s, "MAIL FROM:<noreply@pentest.local>")
              print("MAIL FROM:", r1[:80])
              if r1[:1] == "2":
                  r2 = cmd(s, "RCPT TO:<12283359820@vtext.com>")
                  print("RCPT1:", r2[:80])
              else:
                  print("Relay denied at MAIL FROM")
              s.close()
          except Exception as ex:
              print(f"SendGrid error: {ex}")
          
          print()
          print("=== ess.emag.verizonwireless.com DNS deep ===")
          r = subprocess.run(["host", "-a", "ess.emag.verizonwireless.com"], capture_output=True, text=True, timeout=10)
          print("ALL records:", r.stdout.strip()[:500])
          r2 = subprocess.run(["nslookup", "ess.emag.verizonwireless.com"], capture_output=True, text=True, timeout=10)
          print("nslookup:", r2.stdout.strip()[:300])
          
          print()
          print("=== vtext.com: try low-priority MX (smtpin01) ===")
          try:
              mx1_ip = socket.gethostbyname("smtpin01.vzw.a.cloudfilter.net")
              print(f"smtpin01 IP: {mx1_ip}")
              s3 = socket.socket()
              s3.settimeout(10)
              s3.connect((mx1_ip, 25))
              banner3 = s3.recv(512).decode(errors="replace")
              print(f"Banner: {banner3[:100]}")
              s3.close()
          except Exception as e3:
              print(f"smtpin01: {e3}")
          
          print("DONE")
          PYEOF
